name: Validate game source

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: |
          for file in js/game.js js/character.js js/audio.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
